# ============================================================
# 语料 JSON 结构: {"relative/image/path.jpg": ["caption1", "caption2"...]}
# ============================================================

root: /home/syk/pest_cls_dataset            # 数据集根目录
images: captions/multimodal.lmdb                       
train: captions/v5/train.json         # 相对 root
val: captions/v5/valid.json
class_map_csv: captions/taxonomy.csv         # 包含[pest_name, alias, pest_latin_name]

caption_sample: random                      # caption 采样策略: ["random", "first", "concat"]
val_caption_sample: first                   # 验证集固定取首条, 保证指标可复现

confusion_json: outputs/bioclip2-20261106/valid1/confusion_intensity.json         # 混淆强度json
hard_prob: 0.4
anchors_yaml: /home/syk/pest_cls_dataset/captions/anchors.yaml

augment:
  enabled: true
  close_augment_epoch: 35                  # 该 epoch 起关闭增强(仅保留 resize/normalize)
  resize:
    method: "letterbox"                     # ["shortest_edge", "letterbox", "direct"]
    size: 224                               # tipsv2: 448 / siglip2: 224
    interp: "bilinear"                      # ["bilinear", "bicubic", "nearest"]
    pad_value: 114                          # letterbox 填充灰度
  crop:
    enabled: true
    method: "hybrid"                        # ["random", "center", "directional", "hybrid"]
    scale: [0.7, 0.95]                     # 相对原图宽高的裁剪保留比例区间
    directional_prob: 0.5                   # 在 hybrid 模式下，抽中"单边/定向整刀裁切"的条件概率
    prob: 0.4                               # 触发概率 (建议 0.4 ~ 0.5)
  flip: 0.5                                 # 水平/垂直翻转概率
  vflip: 0.5                                # 单独控制垂直翻转; >0 时覆盖 flip 的垂直分量
  rotate:
    limit: [-10, 10]
    prob: 0.2
  affine:
    percent: 0.12                           # 平移比例
    scale: [0.9, 1.1]
    shear: 10
    prob: 0.3
  perspective:
    scale: [0.0005, 0.001]
    prob: 0.15
  hsv:
    h: 0.015
    s: 0.5
    v: 0.4
    prob: 0.5
  gauss_blur:
    blur: [3, 7]
    sigma: [0.3, 1]
    prob: 0.2
  erase:
    prob: 0.4
    range: [0.01, 0.04]
    max_holes: 4
  normalize:
    mean: [0.5, 0.5, 0.5]         # tipsv2: 0 / siglip2: 0.5
    std: [0.5, 0.5, 0.5]          # tipsv2: 1 / siglip2: 0.5
